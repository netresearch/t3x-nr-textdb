name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '0 6 * * 1'

# A new push to a pull request cancels the run for the push before it, so
# superseded test matrices stop taking runners. Every other run (main, merge
# queue, schedule) gets a group of its own through github.run_id: GitHub keeps
# one pending run per group and cancels the older pending run even when
# cancel-in-progress is off, so a group shared by main pushes and the schedule
# would drop runs. The group sits here in the caller, not in the reusable
# workflow: a caller that invokes ci.yml twice would otherwise put both calls
# in one group and cancel one with the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Per-extension test matrix (intentional-drift). Security/quality jobs are in checks.yml.
jobs:
  ci:
    uses: netresearch/typo3-ci-workflows/.github/workflows/ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.2","8.3","8.4","8.5"]'
      typo3-versions: '["^14.3"]'
      # The functional suite runs against SQLite (Build/FunctionalTests.xml pins
      # typo3DatabaseDriver=pdo_sqlite). It defaults to off in the reusable
      # workflow, which left the extension without any functional CI evidence.
      run-functional-tests: true
      functional-test-db: sqlite
      compact-jobs: true
      # All three server suites share this preflight and strict aggregate.
      # Explicit complete rows add no PHP/TYPO3 cross product.
      functional-db-matrix: >-
        [{"php":"8.5","typo3":"^14.3","db":"mariadb","image":"ghcr.io/netresearch/ci-mirror/mariadb:10.11"},
         {"php":"8.5","typo3":"^14.3","db":"mysql","image":"ghcr.io/netresearch/ci-mirror/mysql:8.0"},
         {"php":"8.5","typo3":"^14.3","db":"postgres","image":"ghcr.io/netresearch/ci-mirror/postgres:16-alpine"}]
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  database-gate:
    name: All database checks
    needs: ci
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - name: Require a successful database matrix
        shell: bash
        env:
          DB_RESULT: ${{ needs.ci.result }}
        run: |
          set -euo pipefail
          if [[ "${DB_RESULT:-}" != success ]]; then
            echo "::error::Database matrix must succeed; got '${DB_RESULT:-missing}'."
            exit 1
          fi
          echo 'All database checks succeeded.'
