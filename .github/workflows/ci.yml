name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: '0 6 * * 1'

# A new push to a pull request cancels the run for the push before it, so
# superseded test matrices stop taking runners. Every other run (main, merge
# queue, schedule) gets a group of its own through github.run_id: GitHub keeps
# one pending run per group and cancels the older pending run even when
# cancel-in-progress is off, so a group shared by main pushes and the schedule
# would drop runs. The group sits here in the caller, not in the reusable
# workflow: a caller that invokes ci.yml twice would otherwise put both calls
# in one group and cancel one with the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Per-extension test matrix (intentional-drift). Security/quality jobs are in checks.yml.
jobs:
  ci:
    uses: netresearch/typo3-ci-workflows/.github/workflows/ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.2","8.3","8.4","8.5"]'
      typo3-versions: '["^14.3"]'
      # The functional suite runs against SQLite (Build/FunctionalTests.xml pins
      # typo3DatabaseDriver=pdo_sqlite). It defaults to off in the reusable
      # workflow, which left the extension without any functional CI evidence.
      run-functional-tests: true
      functional-test-db: sqlite
      compact-jobs: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # The functional suite once more against the database servers the manual
  # names as tested. Only the functional tests run here, on the newest PHP;
  # the job above covers everything else. The reusable workflow maps every
  # functional-test-db value except sqlite and postgres to mysqli and starts
  # db-image, which defaults to MySQL 9.6, so each cell names its image.
  functional-db:
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mariadb
            image: ghcr.io/netresearch/ci-mirror/mariadb:10.11
          - db: mysql
            image: ghcr.io/netresearch/ci-mirror/mysql:8.0
          - db: postgres
            image: ghcr.io/netresearch/ci-mirror/postgres:16-alpine
    uses: netresearch/typo3-ci-workflows/.github/workflows/ci.yml@main
    permissions:
      contents: read
    with:
      php-versions: '["8.5"]'
      typo3-versions: '["^14.3"]'
      run-lint: false
      run-cgl: false
      run-phpstan: false
      run-phpstan-unpinned: false
      run-rector: false
      run-unit-tests: false
      run-docs: false
      run-functional-tests: true
      functional-test-db: ${{ matrix.db }}
      db-image: ${{ matrix.image }}
