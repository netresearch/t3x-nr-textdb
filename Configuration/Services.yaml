services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Netresearch\NrTextdb\:
        resource: '../Classes/*'
        exclude: '../Classes/Domain/Model/*'

    Netresearch\NrTextdb\Service\TranslationService:
        public: true

    # Public so functional tests can replace it with a counting double.
    Netresearch\NrTextdb\Service\LabelTranslatorInterface:
        alias: Netresearch\NrTextdb\Service\LabelTranslator
        public: true

    Netresearch\NrTextdb\Command\ImportCommand:
        tags:
            - name: 'console.command'
              command: 'nr_textdb:import'
              description: 'Imports textdb records from language files'
              schedulable: false
