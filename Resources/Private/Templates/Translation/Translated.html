<html data-namespace-typo3-fluid="true"
      xmlns="http://www.w3.org/1999/xhtml" lang="en"
      xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
>
    <f:layout name="Module"/>

    <f:section name="Content">
        <f:comment><!-- The list view injects only the children of .return, so this heading shows on the standalone view alone. --></f:comment>
        <h1>
            <f:translate key="heading.translated">Translations</f:translate><f:if condition="{translated.0.placeholder}">: {translated.0.placeholder -> f:format.htmlspecialchars()}</f:if>
        </h1>

        <div class="return">
            <f:if condition="{translated}">
                <f:else>
                    <f:be.infobox state="-1">
                        <f:translate key="no-translation">No translations available</f:translate>
                    </f:be.infobox>
                </f:else>
            </f:if>

            <f:form action="translateRecord"
                    method="post"
                    arguments="{parent: originalUid}"
                    class="translation-form"
                    additionalAttributes="{data-uid: originalUid}"
            >
                <div class="table-fit">
                    <table class="table" aria-label="{f:translate(key: 'translations', default: 'Translations')}">
                        <thead>
                            <tr>
                                <th scope="col">
                                    <f:translate key="language">Language</f:translate>
                                </th>
                                <th scope="col">
                                    <f:translate key="translation">Translation</f:translate>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                        <f:for each="{translated}" as="translation">
                            <tr class="translated">
                                <th scope="row" id="textdb-language-{originalUid}-{translation.sysLanguageUid}">
                                    <f:for each="{languages}" as="language">
                                        <f:if condition="{language.languageId} == {translation.sysLanguageUid}">
                                            <core:icon identifier="{language.flagIdentifier}"/>
                                            {language.title -> f:format.htmlspecialchars()}
                                        </f:if>
                                    </f:for>
                                </th>
                                <td>
                                    <f:form.textarea name="update[{translation.localizedUid}]"
                                                     value="{translation.value}"
                                                     class="form-control"
                                                     aria-labelledby="textdb-language-{originalUid}-{translation.sysLanguageUid}"
                                                     placeholder="{f:translate(key: 'translation', default: 'Translation')}"/>
                                </td>
                            </tr>
                        </f:for>
                        <f:for each="{untranslated}" as="language">
                            <tr class="untranslated">
                                <th scope="row" id="textdb-language-{originalUid}-{language.languageId}">
                                    <core:icon identifier="{language.flagIdentifier}"/>
                                    {language.title -> f:format.htmlspecialchars()}
                                </th>
                                <td>
                                    <f:form.textarea name="new[{language.languageId}]"
                                                     value=""
                                                     class="form-control"
                                                     aria-labelledby="textdb-language-{originalUid}-{language.languageId}"
                                                     placeholder="{f:translate(key: 'translation', default: 'Translation')}"/>
                                </td>
                            </tr>
                        </f:for>
                        </tbody>
                    </table>
                </div>
                <br>
                <f:form.submit class="btn btn-primary" value="{f:translate(key: 'save', default: 'Save')}"/>
            </f:form>
        </div>
    </f:section>
</html>
